<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间间隔计算器与时差换算</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100/80 text-slate-800 min-h-screen xl:h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white p-4 xl:p-5 overflow-x-hidden">
    <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col justify-between">
        
        <!-- 头部导航 -->
        <header class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-200/80">
            <div class="flex items-center gap-3">
                <div class="inline-flex items-center justify-center p-2 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-100">
                    <i class="fa-solid fa-clock text-base"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-none">时间间隔计算器 & 时差换算</h1>
                    <p class="text-slate-500 text-xs mt-1">一站式时间差计算、跨国时差换算与多工时累加小工具</p>
                </div>
            </div>
        </header>

        <!-- 主体仪表盘（左右两栏对称排版，减少空白） -->
        <main class="grid grid-cols-1 lg:grid-cols-2 gap-4 my-auto items-stretch">
            
            <!-- 【左栏】：单次时间段计算（竖向拉长，字体放大） -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col justify-between h-full">
                <div>
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-hourglass-start text-indigo-500"></i> 单次时间段计算
                        </h2>
                        <div class="flex gap-2">
                            <button onclick="setPreset('16:50', '18:40')" class="px-3 py-1 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg transition-colors">
                                示例 (16:50-18:40)
                            </button>
                            <button onclick="setCurrentTime()" class="px-3 py-1 text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg transition-colors">
                                填入当前时间
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 my-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2">开始时间 (HH:mm)</label>
                            <input type="time" id="startTime" value="16:50" oninput="calculate()" onchange="calculate()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2">结束时间 (HH:mm)</label>
                            <input type="time" id="endTime" value="18:40" oninput="calculate()" onchange="calculate()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                        </div>
                    </div>

                    <div class="mt-4 flex items-center justify-between">
                        <label class="inline-flex items-center cursor-pointer select-none">
                            <input type="checkbox" id="forceOvernight" onchange="calculate()" class="sr-only peer">
                            <div class="relative w-10 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            <span class="ms-3 text-xs font-medium text-slate-600">强制跨天 (+24h)</span>
                        </label>
                        <span id="overnightBadge" class="hidden text-xs px-3 py-1 rounded-md bg-amber-50 text-amber-600 font-medium border border-amber-200/60">
                            已识别跨天
                        </span>
                    </div>

                    <!-- 内嵌计算结果 -->
                    <div class="mt-6 p-5 bg-indigo-900 text-white rounded-xl shadow-inner relative overflow-hidden flex items-center justify-between">
                        <div>
                            <div class="text-xs text-indigo-300 mb-1">相差总分钟数</div>
                            <div class="flex items-baseline gap-1.5">
                                <span id="resTotalMinutes" class="text-4xl font-extrabold font-mono text-white">110</span>
                                <span class="text-xs text-indigo-200 font-medium">分钟</span>
                            </div>
                        </div>
                        <div class="text-right border-l border-indigo-800/80 pl-6">
                            <div class="text-xs text-indigo-300 mb-1">标准工时格式</div>
                            <div id="resHoursMinutes" class="text-xl font-bold font-mono text-indigo-100">1 小时 50 分</div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100">
                    <button onclick="addToAccumulator()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm shadow-indigo-100 transition-all text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> 加入多段汇总
                    </button>
                </div>
            </div>

            <!-- 【右栏】：时差换算（上） + 累计明细（下），高度和左栏对齐 -->
            <div class="flex flex-col justify-between gap-4 h-full">
                
                <!-- 1. 跨国时差换算（右上） -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
                    <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-earth-asia text-indigo-500"></i> 跨国时差换算
                    </h2>
                    
                    <div class="grid grid-cols-12 gap-3 items-center">
                        <div class="col-span-5 space-y-2">
                            <label class="block text-xs font-semibold text-slate-500">源时区 / 时间</label>
                            <select id="sourceZone" onchange="convertTimeZone()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none">
                                <option value="Asia/Shanghai">中国北京 (UTC+8)</option>
                                <option value="Europe/Moscow">俄罗斯莫斯科 / 喀山 (UTC+3)</option>
                                <option value="Europe/London">英国伦敦 (UTC+0/1)</option>
                                <option value="America/New_York">美国纽约 (UTC-5/4)</option>
                                <option value="Asia/Tokyo">日本东京 (UTC+9)</option>
                            </select>
                            <input type="time" id="sourceTime" value="12:00" oninput="convertTimeZone()" onchange="convertTimeZone()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-mono text-base text-slate-800 focus:outline-none">
                        </div>

                        <div class="col-span-2 flex justify-center pt-5">
                            <button onclick="swapTimeZones()" title="对调时区" class="p-2.5 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-full transition-colors shadow-sm">
                                <i class="fa-solid fa-right-left text-xs"></i>
                            </button>
                        </div>

                        <div class="col-span-5 space-y-2">
                            <label class="block text-xs font-semibold text-slate-500">目标时区 / 结果</label>
                            <select id="targetZone" onchange="convertTimeZone()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 focus:outline-none">
                                <option value="Asia/Shanghai">中国北京 (UTC+8)</option>
                                <option value="Europe/Moscow">俄罗斯莫斯科 / 喀山 (UTC+3)</option>
                                <option value="Europe/London">英国伦敦 (UTC+0/1)</option>
                                <option value="America/New_York">美国纽约 (UTC-5/4)</option>
                                <option value="Asia/Tokyo">日本东京 (UTC+9)</option>
                            </select>
                            <div id="targetResultBox" class="w-full px-3 py-2 bg-indigo-50/60 border border-indigo-100 rounded-xl font-mono text-base font-bold text-indigo-700 flex items-center justify-between">
                                <span id="targetTimeText">07:00</span>
                                <span id="targetDayDiff" class="text-xs font-normal text-indigo-500">同天</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. 多段时间累计明细（右下） -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-indigo-500"></i> 多段累计明细（离线自动保存）
                            </h2>
                            <button onclick="clearAccumulator()" class="text-xs text-rose-500 hover:text-rose-600 font-medium">
                                清空明细
                            </button>
                        </div>
                        
                        <div id="accumulatorList" class="space-y-2 max-h-[150px] overflow-y-auto pr-1">
                            <p class="text-xs text-slate-400 text-center py-6">暂无加入的时间段记录</p>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-sm font-semibold text-slate-800">
                        <span>累计总时长：</span>
                        <span id="totalAccumulatedText" class="text-indigo-600 font-mono text-base">0 小时 0 分钟 (0 分钟)</span>
                    </div>
                </div>

            </div>

        </main>

        <!-- 页脚 -->
        <footer class="text-center text-xs text-slate-400 pt-2 border-t border-slate-200/40 mt-3">
            <p>时间间隔计算器 &copy; 2026</p>
        </footer>
    </div>

    <script>
        let accumulatedSegments = [];

        function loadFromStorage() {
            const saved = localStorage.getItem('time_calculator_segments');
            if (saved) {
                try { accumulatedSegments = JSON.parse(saved); } catch (e) { accumulatedSegments = []; }
            }

            const savedSourceZone = localStorage.getItem('time_calculator_source_zone');
            const savedTargetZone = localStorage.getItem('time_calculator_target_zone');
            
            if (savedSourceZone) document.getElementById('sourceZone').value = savedSourceZone;
            else document.getElementById('sourceZone').value = 'Asia/Shanghai';

            if (savedTargetZone) document.getElementById('targetZone').value = savedTargetZone;
            else document.getElementById('targetZone').value = 'Europe/Moscow';
        }

        function saveToStorage() {
            localStorage.setItem('time_calculator_segments', JSON.stringify(accumulatedSegments));
        }

        function calculate() {
            const startVal = document.getElementById('startTime').value;
            const endVal = document.getElementById('endTime').value;
            const forceOvernight = document.getElementById('forceOvernight').checked;

            if (!startVal || !endVal) return;

            const [h1, m1] = startVal.split(':').map(Number);
            const [h2, m2] = endVal.split(':').map(Number);

            let startMinutes = h1 * 60 + m1;
            let endMinutes = h2 * 60 + m2;

            if (endMinutes < startMinutes || forceOvernight) {
                endMinutes += 24 * 60;
            }

            const diffMinutes = endMinutes - startMinutes;
            const hours = Math.floor(diffMinutes / 60);
            const mins = diffMinutes % 60;

            document.getElementById('resTotalMinutes').innerText = diffMinutes;
            document.getElementById('resHoursMinutes').innerText = `${hours} 小时 ${mins} 分`;

            const badge = document.getElementById('overnightBadge');
            if (endMinutes >= 24 * 60 || forceOvernight) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            return { startVal, endVal, diffMinutes, hours, mins };
        }

        function setPreset(start, end) {
            document.getElementById('startTime').value = start;
            document.getElementById('endTime').value = end;
            document.getElementById('forceOvernight').checked = false;
            calculate();
        }

        function setCurrentTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('startTime').value = `${h}:${m}`;
            calculate();
        }

        function addToAccumulator() {
            const res = calculate();
            if (!res) return;

            accumulatedSegments.push(res);
            saveToStorage();
            renderAccumulator();
        }

        function renderAccumulator() {
            const container = document.getElementById('accumulatorList');
            if (accumulatedSegments.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">暂无加入的时间段记录</p>';
                document.getElementById('totalAccumulatedText').innerText = '0 小时 0 分钟 (0 分钟)';
                return;
            }

            let html = '';
            let totalMins = 0;

            accumulatedSegments.forEach((item, index) => {
                totalMins += item.diffMinutes;
                html += `
                    <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl text-xs">
                        <span class="font-mono text-slate-700 font-medium">${item.startVal} ~ ${item.endVal}</span>
                        <div class="flex items-center gap-3">
                            <span class="font-semibold text-indigo-600 font-mono">+${item.diffMinutes} 分钟 (${item.hours}h ${item.mins}m)</span>
                            <button onclick="removeAccumulator(${index})" class="text-slate-400 hover:text-rose-500">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            const accHours = Math.floor(totalMins / 60);
            const accMins = totalMins % 60;
            document.getElementById('totalAccumulatedText').innerText = `${accHours} 小时 ${accMins} 分钟 (${totalMins} 分钟)`;
        }

        function removeAccumulator(index) {
            accumulatedSegments.splice(index, 1);
            saveToStorage();
            renderAccumulator();
        }

        function clearAccumulator() {
            accumulatedSegments = [];
            saveToStorage();
            renderAccumulator();
        }

        function convertTimeZone() {
            const sourceZone = document.getElementById('sourceZone').value;
            const targetZone = document.getElementById('targetZone').value;
            const sourceTimeStr = document.getElementById('sourceTime').value;

            localStorage.setItem('time_calculator_source_zone', sourceZone);
            localStorage.setItem('time_calculator_target_zone', targetZone);

            if (!sourceTimeStr) return;

            const [hours, minutes] = sourceTimeStr.split(':').map(Number);
            const d = new Date();

            const getOffsetMinutes = (zone, date) => {
                const utcDate = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
                const tzDate = new Date(date.toLocaleString('en-US', { timeZone: zone }));
                return (tzDate - utcDate) / 60000;
            };

            const offsetDiff = getOffsetMinutes(targetZone, d) - getOffsetMinutes(sourceZone, d);
            let totalTargetMins = hours * 60 + minutes + offsetDiff;

            let dayDiffText = "同天";
            if (totalTargetMins >= 24 * 60) {
                totalTargetMins -= 24 * 60;
                dayDiffText = "次日";
            } else if (totalTargetMins < 0) {
                totalTargetMins += 24 * 60;
                dayDiffText = "前一天";
            }

            const targetH = Math.floor(totalTargetMins / 60) % 24;
            const targetM = totalTargetMins % 60;
            const formattedTarget = `${String(targetH).padStart(2, '0')}:${String(targetM).padStart(2, '0')}`;

            document.getElementById('targetTimeText').innerText = formattedTarget;
            document.getElementById('targetDayDiff').innerText = dayDiffText;
        }

        function swapTimeZones() {
            const sZone = document.getElementById('sourceZone');
            const tZone = document.getElementById('targetZone');
            const temp = sZone.value;
            sZone.value = tZone.value;
            tZone.value = temp;
            convertTimeZone();
        }

        window.onload = function() {
            loadFromStorage();
            calculate();
            renderAccumulator();
            
            const now = new Date();
            document.getElementById('sourceTime').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            convertTimeZone();
        };
    </script>
</body>
</html>
