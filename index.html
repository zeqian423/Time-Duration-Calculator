<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间间隔计算器</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-600 text-white rounded-2xl shadow-lg shadow-indigo-200 mb-4">
                <i class="fa-solid font-bold fa-clock text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">时间间隔计算器</h1>
            <p class="text-slate-500 mt-2 text-sm">快速计算两个时刻之间的时长，支持跨天识别与多段累加</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-hourglass-start text-indigo-500"></i> 单次时间段计算
                        </h2>
                        <div class="flex gap-2">
                            <button onclick="setPreset('16:50', '18:40')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg transition-colors">
                                示例 (16:50-18:40)
                            </button>
                            <button onclick="setCurrentTime()" class="px-2.5 py-1 text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg transition-colors">
                                填入当前时间
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1.5">开始时间 (HH:mm)</label>
                            <div class="relative">
                                <input type="time" id="startTime" value="16:50" onchange="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1.5">结束时间 (HH:mm)</label>
                            <div class="relative">
                                <input type="time" id="endTime" value="18:40" onchange="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 flex items-center justify-between pt-2">
                        <label class="inline-flex items-center cursor-pointer select-none">
                            <input type="checkbox" id="forceOvernight" onchange="calculate()" class="sr-only peer">
                            <div class="relative w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                            <span class="ms-2.5 text-xs font-medium text-slate-600">强制按跨天计算 (+24小时)</span>
                        </label>
                        <span id="overnightBadge" class="hidden text-xs px-2 py-0.5 rounded-md bg-amber-50 text-amber-600 font-medium border border-amber-200/60">
                            已自动识别为跨天
                        </span>
                    </div>

                    <div class="mt-6 pt-5 border-t border-slate-100 flex gap-3">
                        <button onclick="calculate()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md shadow-indigo-100 transition-all text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-calculator"></i> 计算时间差
                        </button>
                        <button onclick="addToAccumulator()" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl transition-all text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> 加入汇总
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-indigo-500"></i> 多段时间累计明细
                        </h2>
                        <button onclick="clearAccumulator()" class="text-xs text-rose-500 hover:text-rose-600 font-medium">
                            清空明细
                        </button>
                    </div>
                    
                    <div id="accumulatorList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <p class="text-xs text-slate-400 text-center py-4">暂无加入的时间段记录</p>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-sm font-semibold text-slate-800">
                        <span>累计总时长：</span>
                        <span id="totalAccumulatedText" class="text-indigo-600 font-mono text-base">0 小时 0 分钟 (0 分钟)</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-4">
                <div class="bg-indigo-900 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-indigo-700/30 rounded-full blur-2xl"></div>
                    
                    <span class="text-xs font-semibold tracking-wider text-indigo-300 uppercase">计算结果</span>
                    
                    <div class="mt-4 mb-6">
                        <div class="text-xs text-indigo-200 mb-1">相差总分钟数</div>
                        <div class="flex items-baseline gap-2">
                            <span id="resTotalMinutes" class="text-5xl font-extrabold tracking-tight font-mono text-white">110</span>
                            <span class="text-indigo-200 font-medium">分钟</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-indigo-800/80">
                        <div>
                            <div class="text-xs text-indigo-300 mb-1">标准工时格式</div>
                            <div id="resHoursMinutes" class="text-lg font-semibold font-mono text-white">1 小时 50 分</div>
                        </div>
                        <div>
                            <div class="text-xs text-indigo-300 mb-1">折算浮点小时</div>
                            <div id="resDecimalHours" class="text-lg font-semibold font-mono text-white">1.83 小时</div>
                        </div>
                        <div class="col-span-2 pt-2 border-t border-indigo-800/40">
                            <div class="text-xs text-indigo-300 mb-1">相差总秒数</div>
                            <div id="resTotalSeconds" class="text-base font-semibold font-mono text-indigo-100">6,600 秒</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-12 text-center text-xs text-slate-400">
            <p>时间间隔计算器 &copy; 2026</p>
        </footer>
    </div>

   <script>
        let accumulatedSegments = [];

        // 1. 从本地存储加载历史数据
        function loadFromStorage() {
            const saved = localStorage.getItem('time_calculator_segments');
            if (saved) {
                try {
                    accumulatedSegments = JSON.parse(saved);
                } catch (e) {
                    accumulatedSegments = [];
                }
            }
        }

        // 2. 将数据保存到本地存储
        function saveToStorage() {
            localStorage.setItem('time_calculator_segments', JSON.stringify(accumulatedSegments));
        }

        function calculate() {
            const startVal = document.getElementById('startTime').value;
            const endVal = document.getElementById('endTime').value;
            const forceOvernight = document.getElementById('forceOvernight').checked;

            if (!startVal || !endVal) return;

            const [h1, m1] = startVal.split(':').map(Number);
            const [h2, m2] = endVal.split(':').map(Number);

            let startMinutes = h1 * 60 + m1;
            let endMinutes = h2 * 60 + m2;

            let isAutoOvernight = false;
            if (endMinutes < startMinutes || forceOvernight) {
                endMinutes += 24 * 60;
                if (endMinutes < startMinutes) isAutoOvernight = true;
            }

            const diffMinutes = endMinutes - startMinutes;
            const hours = Math.floor(diffMinutes / 60);
            const mins = diffMinutes % 60;
            const decimalHours = (diffMinutes / 60).toFixed(2);
            const totalSeconds = diffMinutes * 60;

            document.getElementById('resTotalMinutes').innerText = diffMinutes;
            document.getElementById('resHoursMinutes').innerText = `${hours} 小时 ${mins} 分`;
            document.getElementById('resDecimalHours').innerText = `${decimalHours} 小时`;
            document.getElementById('resTotalSeconds').innerText = `${totalSeconds.toLocaleString()} 秒`;

            const badge = document.getElementById('overnightBadge');
            if (endMinutes >= 24 * 60 || forceOvernight) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            return { startVal, endVal, diffMinutes, hours, mins };
        }

        function setPreset(start, end) {
            document.getElementById('startTime').value = start;
            document.getElementById('endTime').value = end;
            document.getElementById('forceOvernight').checked = false;
            calculate();
        }

        function setCurrentTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('startTime').value = `${h}:${m}`;
            calculate();
        }

        function addToAccumulator() {
            const res = calculate();
            if (!res) return;

            accumulatedSegments.push(res);
            saveToStorage(); // 保存到本地
            renderAccumulator();
        }

        function renderAccumulator() {
            const container = document.getElementById('accumulatorList');
            if (accumulatedSegments.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">暂无加入的时间段记录</p>';
                document.getElementById('totalAccumulatedText').innerText = '0 小时 0 分钟 (0 分钟)';
                return;
            }

            let html = '';
            let totalMins = 0;

            accumulatedSegments.forEach((item, index) => {
                totalMins += item.diffMinutes;
                html += `
                    <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-xl text-xs">
                        <span class="font-mono text-slate-700">${item.startVal} ~ ${item.endVal}</span>
                        <div class="flex items-center gap-3">
                            <span class="font-medium text-indigo-600 font-mono">+${item.diffMinutes} 分钟 (${item.hours}h ${item.mins}m)</span>
                            <button onclick="removeAccumulator(${index})" class="text-slate-400 hover:text-rose-500">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            const accHours = Math.floor(totalMins / 60);
            const accMins = totalMins % 60;
            document.getElementById('totalAccumulatedText').innerText = `${accHours} 小时 ${accMins} 分钟 (${totalMins} 分钟)`;
        }

        function removeAccumulator(index) {
            accumulatedSegments.splice(index, 1);
            saveToStorage(); // 保存到本地
            renderAccumulator();
        }

        function clearAccumulator() {
            accumulatedSegments = [];
            saveToStorage(); // 保存到本地
            renderAccumulator();
        }

        // 页面初始化：读取历史数据并渲染
        window.onload = function() {
            loadFromStorage();
            calculate();
            renderAccumulator();
        };
    </script>
</body>
</html>
